<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #f8fafc;
      color: #111827;
    }
    .header {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
    }
    .header-logo {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .header h1 { font-size: 15px; font-weight: 700; }
    .header p { font-size: 11px; opacity: 0.8; margin-top: 2px; }

    .status-bar {
      padding: 10px 16px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #d1d5db;
    }
    .status-dot.active { background: #10b981; }
    .status-dot.error { background: #ef4444; }
    .status-text { font-size: 12px; color: #6b7280; }

    .stats {
      padding: 12px 16px;
      background: white;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      border-bottom: 1px solid #e5e7eb;
    }
    .stat-box {
      background: #f9fafb;
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center;
    }
    .stat-value { font-size: 22px; font-weight: 800; color: #4f46e5; }
    .stat-label { font-size: 10px; color: #9ca3af; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

    .section { padding: 12px 16px; }
    .section-title { font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

    .form-group { margin-bottom: 10px; }
    label { font-size: 12px; font-weight: 600; color: #374151; display: block; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.1); }
    input.mono { font-family: monospace; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .toggle-label { font-size: 12px; font-weight: 600; color: #374151; }

    .toggle {
      position: relative;
      width: 36px; height: 20px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #d1d5db;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }
    .slider:before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }
    input:checked + .slider { background: #10b981; }
    input:checked + .slider:before { transform: translateX(16px); }

    .btn {
      width: 100%;
      padding: 9px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
    }
    .btn-primary:hover { opacity: 0.9; }

    .info-text {
      font-size: 11px;
      color: #6b7280;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    .info-text a { color: #059669; }

    .last-sync {
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
      padding: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">✦</div>
    <div>
      <h1>CareRecruit</h1>
      <p>WhatsApp Web Reader</p>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Checking...</span>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-value" id="capturedCount">0</div>
      <div class="stat-label">Captured today</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="sentCount" style="color:#10b981">0</div>
      <div class="stat-label">Synced today</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Configuration</div>

    <div class="info-text" id="setupInfo">
      Enter your API token to start syncing WhatsApp messages to CareRecruit.
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Enable auto-sync</span>
      <label class="toggle">
        <input type="checkbox" id="enabledToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="form-group">
      <label for="apiToken">API Token</label>
      <input type="password" id="apiToken" class="mono" placeholder="Paste your token here...">
    </div>

    <div class="form-group">
      <label for="apiUrl">API URL (optional)</label>
      <input type="text" id="apiUrl" placeholder="https://care-ats.vercel.app/api/whatsapp-webhook">
    </div>

    <button class="btn btn-primary" id="saveBtn">Save Settings</button>

    <div class="last-sync" id="lastSync"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
